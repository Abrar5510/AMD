<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Expert · Author</title>
<style>
  :root {
    --bg: #0f1114; --panel: #171a1f; --line: #2a2f37; --text: #e8eaed; --muted: #8b93a1;
    --accent: #ffd200; --danger: #ff4d4f; --ok: #3ecf8e; --band-a: #2b3a55; --band-b: #34465f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; letter-spacing: .02em; }
  header h1 span { color: var(--accent); }
  input, textarea, button { font: inherit; color: inherit; }
  input[type=text], input[type=number], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { resize: vertical; min-height: 38px; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); }
  #status.err { color: var(--danger); }
  main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; padding: 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .stage { position: sticky; top: 12px; align-self: start; }
  video { width: 100%; background: #000; border-radius: 8px; display: block; }
  #timeline { position: relative; height: 44px; margin-top: 10px; background: var(--panel); border-radius: 6px; overflow: hidden; cursor: pointer; }
  .band { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; border-right: 1px solid var(--bg); }
  .band.crit { box-shadow: inset 0 3px 0 var(--danger); }
  .band.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cp { position: absolute; top: 0; height: 8px; width: 2px; background: var(--accent); opacity: .7; }
  #playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none; }
  .meta { color: var(--muted); margin-top: 8px; font-size: 12px; }
  #steps { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; grid-template-columns: 96px 1fr; gap: 12px; }
  .card.sel { border-color: var(--accent); }
  .card.crit { border-left: 3px solid var(--danger); }
  .thumb { width: 96px; height: 72px; object-fit: cover; border-radius: 4px; background: #000; }
  .num { font-size: 22px; font-weight: 700; color: var(--accent); }
  .fields { display: grid; gap: 6px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row input[type=number] { width: 80px; }
  label.small { font-size: 12px; color: var(--muted); }
  .said { font-size: 12px; color: var(--muted); font-style: italic; }
  footer { position: sticky; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: var(--panel); border-top: 1px solid var(--line); }
  #edits { color: var(--muted); }
  .grow { flex: 1; }
  .badge { padding: 2px 8px; border-radius: 99px; font-size: 12px; background: var(--line); }
  .badge.ok { background: var(--ok); color: #111; }
</style>
</head>
<body>
<header>
  <h1>Ghost <span>Expert</span> · Author</h1>
  <input id="pid" type="text" list="pids" placeholder="procedure id, e.g. loto-filter" style="max-width:220px">
  <datalist id="pids"></datalist>
  <button id="open">Open</button>
  <input id="file" type="file" accept="video/*" style="max-width:240px">
  <button id="draft" class="primary">Upload &amp; draft</button>
  <span id="status"></span>
</header>

<main>
  <section class="stage">
    <video id="video" controls playsinline></video>
    <div id="timeline"><div id="playhead"></div></div>
    <div class="meta" id="meta"></div>
  </section>
  <section>
    <input id="title" type="text" placeholder="Procedure title" style="font-size:18px;font-weight:600;margin-bottom:12px">
    <div id="steps"></div>
  </section>
</main>

<footer>
  <span id="state" class="badge">no draft</span>
  <span id="edits">Expert edits: 0</span>
  <span class="grow"></span>
  <button id="approve" class="primary" disabled>Approve procedure</button>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const token = params.get("token");
let pid = params.get("id") || "";
let draft = null, selected = null, saveTimer = null, clipEnd = null;

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids) n.append(k);
  return n;
}
function status(text, err = false) { $("status").textContent = text; $("status").className = err ? "err" : ""; }
async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (token) headers["X-App-Token"] = token;
  const r = await fetch(path, { ...opts, headers });
  const body = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(body.detail || body || r.statusText);
  return body;
}
const fmt = (s) => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`;

async function listIds() {
  try {
    const ids = await api("/api/procedures");
    $("pids").replaceChildren(...ids.map((i) => el("option", { value: i })));
  } catch { /* list is a convenience */ }
}

async function open(id) {
  pid = id; $("pid").value = id;
  history.replaceState(null, "", `?id=${encodeURIComponent(id)}${token ? `&token=${encodeURIComponent(token)}` : ""}`);
  try {
    draft = await api(`/api/procedures/${id}/draft`);
    $("video").src = `/files/${id}/expert.mp4`;
    render();
    status("");
  } catch (e) { status(e.message, true); }
}

$("open").onclick = () => $("pid").value && open($("pid").value.trim());

$("draft").onclick = async () => {
  const id = $("pid").value.trim(), file = $("file").files[0];
  if (!id || !file) return status("Pick a procedure id and an expert video first.", true);
  $("draft").disabled = true;
  try {
    status("Uploading…");
    await api(`/api/procedures/${id}/video`, { method: "PUT", body: file });
    const t0 = performance.now();
    const tick = setInterval(() => status(`Drafting on the AMD GPU: Whisper → SigLIP → Gemma… ${((performance.now() - t0) / 1000).toFixed(0)}s`), 250);
    try { await api(`/api/procedures/${id}/draft`, { method: "POST" }); } finally { clearInterval(tick); }
    await open(id);
    listIds();
  } catch (e) { status(e.message, true); }
  $("draft").disabled = false;
};

function edited(structural = false) {
  draft.edits += 1;
  draft.approved = false;
  if (structural) render(); else renderChrome();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 500);
}

async function save() {
  try {
    await api(`/api/procedures/${pid}/draft`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: draft.title, steps: draft.steps, edits: draft.edits }),
    });
    status("Saved");
  } catch (e) { status(e.message, true); }
}

$("approve").onclick = async () => {
  clearTimeout(saveTimer);
  await save();
  try {
    const proc = await api(`/api/procedures/${pid}/approve`, { method: "POST" });
    await open(pid);
    status(`Approved: ${proc.steps.length} steps, coach references built.`);
  } catch (e) { status(e.message, true); }
};

$("title").onchange = (e) => { draft.title = e.target.value; edited(); };

function said(step) {
  const [a, b] = step.expert_clip;
  return (draft.transcript || []).filter((s) => (s.start + s.end) / 2 >= a && (s.start + s.end) / 2 < b).map((s) => s.text).join(" ");
}

function renderChrome() {
  $("edits").textContent = `Expert edits: ${draft.edits}`;
  $("state").textContent = draft.approved ? "approved" : "draft";
  $("state").className = "badge" + (draft.approved ? " ok" : "");
  $("approve").disabled = false;
  const t = draft.timings || {};
  $("meta").textContent = `${draft.steps.length} steps from ${draft.segments?.length ?? "?"} segments · ` +
    `drafted in ${t.total_s ?? "?"}s (SigLIP ${t.siglip_s ?? "?"}s · Whisper ${t.whisper_s ?? "?"}s · Gemma ${t.gemma_s ?? "?"}s)`;
  renderTimeline();
}

function renderTimeline() {
  const dur = draft.duration_s, tl = $("timeline");
  tl.replaceChildren($("playhead"));
  draft.steps.forEach((s, i) => {
    const [a, b] = s.expert_clip;
    tl.append(el("div", {
      className: "band" + (s.safety_critical ? " crit" : "") + (selected === i ? " sel" : ""),
      textContent: s.id ?? i + 1,
      title: s.title,
      style: `left:${(a / dur) * 100}%;width:${((b - a) / dur) * 100}%;background:var(${i % 2 ? "--band-b" : "--band-a"})`,
    }));
  });
  for (const t of draft.change_points || []) tl.append(el("div", { className: "cp", style: `left:${(t / dur) * 100}%` }));
}

$("timeline").onclick = (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  $("video").currentTime = ((e.clientX - r.left) / r.width) * draft.duration_s;
};
$("video").ontimeupdate = () => {
  const v = $("video");
  if (draft) $("playhead").style.left = `${(v.currentTime / draft.duration_s) * 100}%`;
  if (clipEnd !== null && v.currentTime >= clipEnd) { v.pause(); clipEnd = null; }
};

function render() {
  $("title").value = draft.title;
  draft.steps.forEach((s, i) => { s.id = i + 1; });
  $("steps").replaceChildren(...draft.steps.map(card));
  renderChrome();
}

function card(s, i) {
  const field = (key, tag = "input", placeholder = "") => {
    const n = el(tag, { value: s[key] ?? "", placeholder, ...(tag === "input" ? { type: "text" } : { rows: 2 }) });
    n.onchange = () => { s[key] = n.value; edited(); };
    return n;
  };
  const time = (idx) => {
    const n = el("input", { type: "number", step: 0.1, min: 0, value: s.expert_clip[idx] });
    n.onchange = () => { s.expert_clip[idx] = Math.round(parseFloat(n.value) * 10) / 10; edited(true); };
    return n;
  };
  const setHere = (idx) => el("button", {
    textContent: idx ? "end ⟵ playhead" : "start ⟵ playhead",
    onclick: () => { s.expert_clip[idx] = Math.round($("video").currentTime * 10) / 10; edited(true); },
  });
  const crit = el("input", { type: "checkbox", checked: !!s.safety_critical });
  crit.onchange = () => { s.safety_critical = crit.checked; edited(true); };

  const play = el("button", { textContent: "▶ clip", onclick: () => {
    const v = $("video"); v.currentTime = s.expert_clip[0]; clipEnd = s.expert_clip[1]; v.play();
  } });
  const split = el("button", { textContent: "split at playhead", onclick: () => {
    const t = Math.round($("video").currentTime * 10) / 10, [a, b] = s.expert_clip;
    if (!(t > a && t < b)) return status("Move the playhead inside this step to split it.", true);
    s.expert_clip = [a, t];
    draft.steps.splice(i + 1, 0, { title: "", instruction: "", visual_check: "", safety_critical: false, common_mistake: "", expert_clip: [t, b] });
    edited(true);
  } });
  const merge = el("button", { textContent: "merge with next", disabled: i === draft.steps.length - 1, onclick: () => {
    const next = draft.steps[i + 1];
    s.expert_clip = [s.expert_clip[0], next.expert_clip[1]];
    s.safety_critical = s.safety_critical || next.safety_critical;
    draft.steps.splice(i + 1, 1);
    edited(true);
  } });
  const del = el("button", { textContent: "delete", onclick: () => { draft.steps.splice(i, 1); edited(true); } });

  const thumb = el("img", { className: "thumb", alt: "" });
  if (s.keyframe) thumb.src = `/files/${pid}/${s.keyframe}?v=${draft.edits}`;
  const words = said(s);

  const c = el("div", { className: "card" + (s.safety_critical ? " crit" : "") + (selected === i ? " sel" : "") },
    el("div", {}, el("div", { className: "num", textContent: i + 1 }), thumb),
    el("div", { className: "fields" },
      field("title", "input", "Step title"),
      field("instruction", "textarea", "What the trainee does"),
      el("label", { className: "small", textContent: "Visual check: what the camera sees when it's done" }),
      field("visual_check", "textarea", "e.g. a yellow tag hangs on the red lockout box"),
      field("common_mistake", "input", "Common mistake (optional)"),
      el("label", { className: "small" }, crit, " ⚠ safety-critical: skipping it interrupts the trainee"),
      el("div", { className: "row" },
        el("span", { className: "small", textContent: "Expert clip (s)" }),
        time(0), el("span", { className: "small", textContent: "→" }), time(1),
        el("span", { className: "small", textContent: `${fmt(s.expert_clip[0])}–${fmt(s.expert_clip[1])}` })),
      el("div", { className: "row" }, play, setHere(0), setHere(1), split, merge, del),
      words ? el("div", { className: "said", textContent: `“${words}”` }) : ""));
  c.onclick = () => {
    if (selected === i) return;
    selected = i;
    document.querySelectorAll(".card").forEach((n, k) => n.classList.toggle("sel", k === i));
    renderTimeline();
  };
  return c;
}

listIds();
if (pid) open(pid);
</script>
</body>
</html>
