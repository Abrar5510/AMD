# Ghost Expert on one AMD Instinct GPU: vLLM (Gemma 3 vision) + the FastAPI app.
x-amd-gpu: &amd-gpu
  devices:
    - /dev/kfd
    - /dev/dri
  group_add:
    - video
  ipc: host
  shm_size: 16g
  security_opt:
    - seccomp=unconfined

services:
  vllm:
    # ponytail: "latest" for the first smoke test; pin the tag that works (see README) before the demo.
    image: ${VLLM_IMAGE:-rocm/vllm:latest}
    entrypoint: ["vllm", "serve"]
    command:
      - ${MODEL:-google/gemma-3-12b-it}
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=${MAX_MODEL_LEN:-16384}
      - '--limit-mm-per-prompt={"image": 8}'
      # Leave GPU memory for SigLIP + Whisper + Kokoro, which share this GPU from Phase 2.
      - --gpu-memory-utilization=${GPU_MEM_UTIL:-0.6}
    environment:
      HF_TOKEN: ${HF_TOKEN}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
    volumes:
      - ./.hf-cache:/root/.cache/huggingface
    <<: *amd-gpu
    # Localhost only: reach it from your laptop with an SSH tunnel, never expose it publicly.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 900s  # first start downloads the model weights

  app:
    build: .
    <<: *amd-gpu
    env_file: .env  # HF_TOKEN, SIGLIP_MODEL, COACH_* knobs
    environment:
      VLLM_URL: http://vllm:8000
      MODEL: ${MODEL:-google/gemma-3-12b-it}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
    volumes:
      - ./.hf-cache:/root/.cache/huggingface
      - ./procedures:/srv/procedures
      - ./eval:/srv/eval
    ports:
      - "8080:8080"
    depends_on:
      vllm:
        condition: service_healthy
